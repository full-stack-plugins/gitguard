name: GitGuard restricted Git compatibility

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  restricted-git:
    runs-on: ubuntu-24.04
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "1"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
    defaults:
      run:
        working-directory: gitguard
    steps:
      - uses: actions/checkout@v4
        with:
          path: gitguard
      - uses: actions/checkout@v4
        with:
          repository: full-stack-plugins/guardengine
          ref: b0e4b445e1a20a9354d55ebb41bbedaf16ec8a74
          path: guardengine
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Record and require the newer Git integrity profile
        run: |
          /usr/bin/git --version
          python3 - <<'PY'
          import subprocess
          version = subprocess.check_output(['/usr/bin/git', '--version'], text=True).strip()
          numeric = version.removeprefix('git version ').split('.')
          assert tuple(map(int, numeric[:2])) >= (2, 50), version
          PY
      - name: Check affected targets
        run: cargo clippy --locked --features privileged-execution --lib --test runner_security --test atomic_admission --test executor_disabled --example local_bare_apply -- -D warnings
      - name: Verify isolation and integrity checks
        run: |
          umask 022
          cargo test --locked --features privileged-execution --lib git::
          cargo test --locked --features privileged-execution --lib execution::apply::tests::actual_cas_then_delivery_failure_keeps_uncertainty_and_does_not_undo -- --exact
          cargo test --locked --features privileged-execution --test runner_security --test atomic_admission --test executor_disabled
      - name: Verify the default writer remains disabled
        run: |
          umask 022
          cargo test --locked --test atomic_admission --test executor_disabled
      - name: Exercise only self-created isolated bare repositories
        run: |
          umask 022
          cargo run --locked --features privileged-execution --example local_bare_apply
